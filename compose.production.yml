name: bansir-ultragas
x-service: &service
  image: bansir-ultragas:${IMAGE_TAG:-local}
  build: .
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 120s
  extra_hosts: [host.docker.internal:host-gateway]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  api:
    <<: *service
    # Bound the API process and its short-lived PDF parsers on the 4 GB host.
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    env_file: [deploy/api.env]
    environment:
      NODE_ENV: production
      DATABASE_ENGINE: postgres
      PORT: 5000
      PDF_MAX_CONCURRENT: 1
    ports: [127.0.0.1:5000:5000]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  notifications:
    <<: *service
    env_file: [deploy/notifications.env]
    environment: {NODE_ENV: production}
    command: [node, scripts/worker-postgres.js, notification]
  fiscal:
    <<: *service
    env_file: [deploy/fiscal.env]
    environment: {NODE_ENV: production}
    command: [node, scripts/worker-postgres.js, fiscal]
  whatsapp:
    <<: *service
    profiles: [meta]
    env_file:
      - path: deploy/whatsapp.env
        required: false
    environment: {NODE_ENV: production}
    command: [node, src/postgres/whatsapp.worker.js]
